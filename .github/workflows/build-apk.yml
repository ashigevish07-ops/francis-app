name: Build FRANCIS OPTIMIZE APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Install Android NDK and CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Build FRANCIS OPTIMIZE Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename Output APK
        run: |
          mkdir -p release_out
          cp app/build/outputs/apk/debug/app-debug.apk release_out/FRANCIS-OPTIMIZE-v2.0.apk
          ls -lh release_out/FRANCIS-OPTIMIZE-v2.0.apk

      - name: Upload FRANCIS-OPTIMIZE.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FRANCIS-OPTIMIZE-APK
          path: release_out/FRANCIS-OPTIMIZE-v2.0.apk
